<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="gradShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3b66" />
      <stop offset="100%" stop-color="#001d3d" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a261" />
      <stop offset="100%" stop-color="#e76f51" />
    </linearGradient>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="120" cy="120" r="110" fill="#ffffff" stroke="#0d3b66" stroke-width="6"/>
  <circle cx="120" cy="120" r="102" fill="none" stroke="#e76f51" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Main Shield -->
  <path d="M 120,35 Q 175,45 175,90 Q 175,155 120,185 Q 65,155 65,90 Q 65,45 120,35 Z" 
        fill="url(#gradShield)" stroke="#f4a261" stroke-width="3"/>
  
  <!-- Gear / Cog (Engineering symbol) -->
  <circle cx="120" cy="98" r="32" fill="#ffffff" opacity="0.12"/>
  <path d="M 120,72 L 122,80 L 128,81 L 134,76 L 138,82 L 134,87 L 138,92 L 145,92 L 145,100 L 138,100 L 135,106 L 139,111 L 134,116 L 128,112 L 123,115 L 121,122 L 115,121 L 113,115 L 108,113 L 102,118 L 98,112 L 102,107 L 98,102 L 91,101 L 92,93 L 99,93 L 102,87 L 98,82 L 103,77 L 109,81 L 114,79 Z" fill="#f4a261"/>
  
  <!-- Torch / Flame (Knowledge) -->
  <path d="M 120,84 Q 126,92 120,102 Q 114,92 120,84 Z" fill="#ffdd59"/>
  <circle cx="120" cy="92" r="3" fill="#ffffff"/>
  
  <!-- Open Book -->
  <path d="M 96,128 Q 120,123 120,136 Q 120,123 144,128 L 142,148 Q 120,143 120,154 Q 120,143 98,148 Z" 
        fill="#ffffff" stroke="#f4a261" stroke-width="1.5"/>
  <line x1="120" y1="136" x2="120" y2="154" stroke="#0d3b66" stroke-width="1.5"/>

  <!-- Stars -->
  <polygon points="120,44 122,50 128,50 123,54 125,60 120,56 115,60 117,54 112,50 118,50" fill="#f4a261"/>

  <!-- Text Top Curved Effect / Ribbons -->
  <text x="120" y="202" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d3b66" text-anchor="middle" letter-spacing="1">G. PULLAIAH</text>
  <text x="120" y="215" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#e76f51" text-anchor="middle" letter-spacing="0.5">COLLEGE OF ENGG &amp; TECH</text>
  <text x="120" y="226" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="7.5" font-weight="500" fill="#666666" text-anchor="middle">KURNOOL (ESTD 2007) • AUTONOMOUS</text>
</svg>
